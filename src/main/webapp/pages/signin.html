<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sign in — MoodCanvas</title><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&display=swap" rel="stylesheet"><link rel="stylesheet" href="../css/style.css"></head><body class="auth-page"><nav class="nav wrap"><a class="brand" href="index.html"><span class="brand-mark">✳</span> moodcanvas</a><a class="nav-back" href="index.html">← Back home</a></nav><main class="auth-wrap"><section class="auth-card"><div class="auth-emoji">🎨</div><span class="eyebrow">YOUR LITTLE CORNER OF ART</span><h1>Welcome <em>back.</em></h1><p>Pick up where your feelings left off.</p><div id="notice" class="notice" role="status" hidden="hidden"></div><form action="../login" method="post" class="form-stack"><label>Email address<input type="email" name="email" autocomplete="email" placeholder="you@example.com" required></label><label>Password<input type="password" name="password" autocomplete="current-password" placeholder="Your password" required></label><div class="form-row"><span></span><a href="#" class="text-link">Forgot password?</a></div><button class="button button-full" type="submit">Sign in <span>↗</span></button></form><p class="auth-foot">New to MoodCanvas? <a class="text-link" href="register.html">Create an account</a></p></section><p class="auth-whisper">Take a breath. You’re right where you need to be. <span>♡</span></p></main><script>var query=new URLSearchParams(location.search);var notice=document.querySelector('#notice');if(query.has('registered')){notice.hidden=false;notice.textContent='Your account is ready. Sign in to begin.'}if(query.get('error')==='invalid'){notice.hidden=false;notice.textContent='That email and password did not match. Please try again.'}if(query.get('error')==='database'){notice.hidden=false;notice.textContent='The database could not start. In Eclipse, run Maven → Update Project, then restart Tomcat. See README.md for MySQL setup.'}</script></body></html>
