<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Create account — MoodCanvas</title><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&display=swap" rel="stylesheet"><link rel="stylesheet" href="../css/style.css"></head><body class="auth-page"><nav class="nav wrap"><a class="brand" href="index.html"><span class="brand-mark">✳</span> moodcanvas</a><a class="nav-back" href="index.html">← Back home</a></nav><main class="auth-wrap"><section class="auth-card"><div class="auth-emoji">🌷</div><span class="eyebrow">A FRESH PAGE</span><h1>Make room for <em>art.</em></h1><p>Create your account and start your mood journal.</p><div id="notice" class="notice" role="status" hidden="hidden"></div><form action="../register" method="post" class="form-stack"><label>Your name<input name="name" maxlength="100" autocomplete="name" placeholder="What should we call you?" required></label><label>Email address<input type="email" name="email" autocomplete="email" placeholder="you@example.com" required></label><label>Password<input type="password" name="password" minlength="8" maxlength="200" autocomplete="new-password" placeholder="At least 8 characters" required></label><button class="button button-full" type="submit">Create my account <span>↗</span></button></form><p class="auth-foot">Already have an account? <a class="text-link" href="signin.html">Sign in</a></p></section><p class="auth-whisper">Your feelings are welcome here. <span>♡</span></p></main><script>var error=new URLSearchParams(location.search).get('error');var notice=document.querySelector('#notice');var messages={invalid:'Please enter your name, a valid email, and a password with at least 8 characters.',exists:'An account with that email already exists. Try signing in instead.',database:'The database could not start. In Eclipse, run Maven → Update Project, then restart Tomcat. See README.md for setup help.'};if(messages[error]){notice.hidden=false;notice.textContent=messages[error]}</script></body></html>
